<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Ilustración de una conversación de atención al cliente con análisis de IA">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031427"/>
      <stop offset="1" stop-color="#06283a"/>
    </linearGradient>
    <radialGradient id="brillo" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agente" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005822"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="puntos" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e3a52" opacity="0.55"/>
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#fondo)"/>
  <rect width="900" height="1100" fill="url(#puntos)"/>
  <circle cx="450" cy="470" r="470" fill="url(#brillo)"/>

  <!-- Ventana de chat -->
  <g transform="translate(150,170)" filter="url(#sombra)">
    <rect width="520" height="640" rx="28" fill="#0b1c30" stroke="#1e293b" stroke-width="2"/>
    <rect width="520" height="84" rx="28" fill="#000f21"/>
    <rect y="56" width="520" height="28" fill="#000f21"/>
    <circle cx="52" cy="42" r="22" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="52" cy="42" r="8" fill="#34d399"/>
    <rect x="88" y="30" width="140" height="10" rx="5" fill="#e2e8f0" opacity="0.85"/>
    <rect x="88" y="50" width="90" height="8" rx="4" fill="#64748b"/>
    <circle cx="480" cy="42" r="6" fill="#34d399"/>

    <!-- Cliente -->
    <rect x="28" y="112" width="300" height="78" rx="20" fill="#102034" stroke="#1e293b"/>
    <rect x="48" y="134" width="240" height="9" rx="4.5" fill="#94a3b8" opacity="0.8"/>
    <rect x="48" y="156" width="170" height="9" rx="4.5" fill="#94a3b8" opacity="0.5"/>

    <!-- Agente -->
    <rect x="188" y="216" width="304" height="96" rx="20" fill="url(#agente)"/>
    <rect x="210" y="240" width="240" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
    <rect x="210" y="262" width="210" height="9" rx="4.5" fill="#ffffff" opacity="0.75"/>
    <rect x="210" y="284" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.6"/>

    <!-- Cliente 2 -->
    <rect x="28" y="338" width="240" height="56" rx="20" fill="#102034" stroke="#1e293b"/>
    <rect x="48" y="360" width="190" height="9" rx="4.5" fill="#94a3b8" opacity="0.7"/>

    <!-- Escribiendo -->
    <rect x="28" y="420" width="96" height="46" rx="23" fill="#102034" stroke="#1e293b"/>
    <circle cx="56" cy="443" r="5" fill="#34d399" opacity="0.45"/>
    <circle cx="76" cy="443" r="5" fill="#34d399" opacity="0.75"/>
    <circle cx="96" cy="443" r="5" fill="#34d399"/>

    <!-- Barra de escritura -->
    <rect x="24" y="552" width="472" height="64" rx="20" fill="#000f21" stroke="#1e293b"/>
    <rect x="48" y="578" width="200" height="9" rx="4.5" fill="#475569"/>
    <circle cx="458" cy="584" r="20" fill="#10b981"/>
    <path d="M450 575 L471 584 L450 593 L453.5 584 Z" fill="#003824"/>
  </g>

  <!-- Tarjeta: análisis de IA -->
  <g transform="translate(500,300)" filter="url(#sombra)">
    <rect width="290" height="250" rx="22" fill="#0b1c30" stroke="#10b981" stroke-opacity="0.55" stroke-width="2"/>
    <text x="24" y="40" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#34d399">ASISTENTE IA</text>
    <path d="M258 22 L263 33 L274 38 L263 43 L258 54 L253 43 L242 38 L253 33 Z" fill="#6ee7b7"/>
    <rect x="24" y="58" width="122" height="28" rx="14" fill="#f43f5e" fill-opacity="0.18" stroke="#fb7185" stroke-opacity="0.7"/>
    <text x="41" y="77" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#fda4af">Prioridad alta</text>
    <rect x="156" y="58" width="84" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="172" y="77" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6ee7b7">Soporte</text>
    <rect x="24" y="108" width="240" height="9" rx="4.5" fill="#cbd5e1" opacity="0.8"/>
    <rect x="24" y="128" width="200" height="9" rx="4.5" fill="#cbd5e1" opacity="0.6"/>
    <rect x="24" y="148" width="220" height="9" rx="4.5" fill="#cbd5e1" opacity="0.4"/>
    <rect x="24" y="176" width="242" height="54" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="38" y="197" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Respuesta sugerida</text>
    <rect x="38" y="208" width="170" height="7" rx="3.5" fill="#6ee7b7" opacity="0.6"/>
  </g>

  <!-- Tarjeta: satisfacción -->
  <g transform="translate(560,100)" filter="url(#sombra)">
    <rect width="170" height="104" rx="20" fill="#0b1c30" stroke="#1e293b" stroke-width="2"/>
    <path d="M35 74 A50 50 0 0 1 135 74" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <path d="M35 74 A50 50 0 0 1 120.4 38.6" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
    <text x="85" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">92</text>
    <text x="85" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Satisfacción</text>
  </g>

  <!-- Chip: multicanal -->
  <g transform="translate(60,70)" filter="url(#sombra)">
    <rect width="250" height="76" rx="38" fill="#0b1c30" stroke="#1e293b" stroke-width="2"/>
    <circle cx="44" cy="38" r="18" fill="#10b981" fill-opacity="0.22" stroke="#10b981"/>
    <circle cx="44" cy="38" r="6" fill="#34d399"/>
    <circle cx="86" cy="38" r="18" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8"/>
    <circle cx="86" cy="38" r="6" fill="#7dd3fc"/>
    <circle cx="128" cy="38" r="18" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa"/>
    <circle cx="128" cy="38" r="6" fill="#c4b5fd"/>
    <text x="160" y="44" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">Multicanal</text>
  </g>
</svg>
