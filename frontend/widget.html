<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniDesk — Escríbenos</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#031427;color:#e2e8f0;font-family:system-ui,sans-serif}
.card{width:100%;max-width:420px;margin:16px;background:#0b1c30;border:1px solid #2a3a4f;border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:22px;color:#fff}p.sub{margin:0 0 20px;color:#94a3b8;font-size:14px}
label{display:block;margin:14px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;background:#071727;color:#fff;border:1px solid #1e2e42;border-radius:8px;padding:10px 12px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:#10b981}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:#10b981;color:#002113;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#hilo p{margin:8px 0;padding:8px 12px;border-radius:8px;background:#071727;font-size:14px;white-space:pre-wrap}#hilo p.agente{background:#002113;border:1px solid #10b981}#hilo{margin-top:16px}#nuevo{background:#1e2e42;color:#e2e8f0}
#res{margin-top:16px;font-size:14px;min-height:20px}.ok{color:#34d399}.mal{color:#f87171}
</style></head><body>
<form class="card" id="f">
<img src="assets/logo.png" alt="Logo de OmniDesk" width="72" height="72" style="display:block;margin:0 auto 12px">
<h1>¿En qué te ayudamos?</h1><p class="sub">Déjanos tu mensaje y un agente te responderá.</p>
<label for="nombre">Nombre</label><input id="nombre" maxlength="100" required>
<label for="correo">Correo (opcional)</label><input id="correo" type="email" maxlength="100">
<label for="mensaje">Mensaje</label><textarea id="mensaje" rows="4" maxlength="1000" required></textarea>
<button id="b" type="submit">Enviar</button><div id="res" role="status"></div>
<div id="hilo" aria-live="polite"></div>
<button id="nuevo" type="button" hidden>Escribir un mensaje nuevo</button>
</form>
<script>
// Cambia esta URL si el backend no corre en tu propia máquina.
const API_URL = 'http://localhost:3000';
const CLAVE = 'omnidesk_widget_token';
const f = document.getElementById('f'), res = document.getElementById('res'), b = document.getElementById('b');
const hilo = document.getElementById('hilo'), nuevo = document.getElementById('nuevo');
const campos = [nombre, correo, mensaje];
let temporizador = null;

const guardado = () => { try { return localStorage.getItem(CLAVE); } catch (_) { return null; } };
const guardar = t => { try { t ? localStorage.setItem(CLAVE, t) : localStorage.removeItem(CLAVE); } catch (_) {} };

function modoConversacion(activa) {
  campos.forEach(c => { c.disabled = activa; c.style.display = activa ? 'none' : ''; });
  document.querySelectorAll('label').forEach(l => l.style.display = activa ? 'none' : '');
  b.style.display = activa ? 'none' : ''; nuevo.hidden = !activa;
  if (!activa) { hilo.replaceChildren(); clearInterval(temporizador); temporizador = null; }
}

async function cargarRespuestas() {
  const t = guardado(); if (!t) return;
  try {
    const r = await fetch(API_URL + '/api/widget/mensajes?token=' + encodeURIComponent(t));
    if (r.status === 404) { guardar(null); modoConversacion(false); return; }
    if (!r.ok) return;
    const { mensajes } = await r.json();
    hilo.replaceChildren();
    for (const m of mensajes) {
      const p = document.createElement('p');
      p.className = m.remitente === 'Agente' ? 'agente' : '';
      p.textContent = (m.remitente === 'Agente' ? 'Agente: ' : 'Tú: ') + m.contenido;
      hilo.appendChild(p);
    }
  } catch (_) { /* sin conexión: se reintenta en el siguiente ciclo */ }
}

function seguirConversacion() {
  modoConversacion(true); cargarRespuestas();
  clearInterval(temporizador); temporizador = setInterval(cargarRespuestas, 10000);
}

f.addEventListener('submit', async e => {
  e.preventDefault(); b.disabled = true; res.className = ''; res.textContent = 'Enviando…';
  try {
    const r = await fetch(API_URL + '/api/widget/mensajes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: nombre.value, correo: correo.value, mensaje: mensaje.value })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { res.className = 'ok'; res.textContent = d.mensaje; mensaje.value = ''; guardar(d.token); seguirConversacion(); }
    else { res.className = 'mal'; res.textContent = (d.error && d.error.mensaje) || 'No se pudo enviar.'; }
  } catch (_) { res.className = 'mal'; res.textContent = 'No hay conexión con el servidor.'; }
  b.disabled = false;
});

nuevo.addEventListener('click', () => { guardar(null); modoConversacion(false); res.textContent = ''; });
if (guardado()) seguirConversacion();
</script></body></html>
