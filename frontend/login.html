<!DOCTYPE html>

<html class="dark" lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script src="assets/omnidesk-tokens.js?v=4"></script></head><body class="bg-[#031427] font-body-md text-on-surface antialiased selection:bg-emerald-500/20 selection:text-emerald-300"><main class="relative w-full min-h-screen bg-[#031427] flex items-center justify-center overflow-hidden"><div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_50%_40%,rgba(16,185,129,0.08),rgba(3,20,39,0)_65%)]"></div><div class="relative z-10 flex flex-col w-full items-center justify-center py-12 px-4 sm:px-6">
<!-- Card Container -->
<div class="w-full max-w-[440px] bg-[#0b1c30] border border-[#2a3a4f]/70 rounded-2xl shadow-2xl shadow-black/50 p-8 sm:p-10 flex flex-col items-center backdrop-blur-sm">
<!-- OmniDesk Logo Icon -->
<div class="w-12 h-12 rounded-xl bg-[#002113] border border-emerald-500/30 flex items-center justify-center text-primary mb-5 shadow-lg shadow-emerald-950/40">
<span class="material-symbols-outlined text-[26px] text-[#34d399]">chat</span>
</div>
<!-- Title & Subtitle -->
<h1 class="font-headline-md text-headline-md text-white font-semibold tracking-tight text-center">
      OmniDesk
    </h1>
<p class="font-body-sm text-body-sm text-[#94a3b8] mt-1 mb-8 text-center">
      Panel de atención al cliente
    </p>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Correo Electrónico -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-[11px] text-[#94a3b8] tracking-wider font-semibold uppercase" for="email">
          CORREO ELECTRÓNICO
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#64748b] select-none pointer-events-none">
            mail
          </span>
<input class="w-full bg-[#071727] text-white font-body-md text-body-md pl-11 pr-4 py-3 rounded-lg border border-[#1e2e42] focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981] focus:outline-none transition-all placeholder:text-[#64748b]" id="email" name="email" placeholder="agente@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Contraseña -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-[11px] text-[#94a3b8] tracking-wider font-semibold uppercase" for="password">
          CONTRASEÑA
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-[20px] text-[#64748b] select-none pointer-events-none">
            lock
          </span>
<input class="w-full bg-[#071727] text-white font-body-md text-body-md pl-11 pr-11 py-3 rounded-lg border border-[#1e2e42] focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981] focus:outline-none transition-all placeholder:text-[#64748b]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute right-3 text-[#64748b] hover:text-[#bec6e0] transition-colors p-1 flex items-center justify-center rounded" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordVisibilityIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 py-3 px-4 bg-[#10b981] hover:bg-[#059669] text-white font-semibold text-[14px] rounded-lg transition-all duration-150 flex items-center justify-center gap-2 active:scale-[0.99] shadow-md shadow-emerald-950/30" id="submitBtn" type="submit">
<span id="btnText">Iniciar Sesión</span>
<span class="material-symbols-outlined animate-spin text-[18px] hidden" id="btnSpinner">progress_activity</span>
</button>
<!-- Forgot Password Link -->
<div class="text-center mt-2">
<a class="font-body-sm text-body-sm text-[#34d399] hover:text-[#6ee7b7] transition-colors underline-offset-4 hover:underline" href="javascript:void(0)">
          ¿Olvidaste tu contraseña?
        </a>
</div>
</form>
</div>
<!-- Footer Copyright -->
<footer class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-[#64748b]">
      © 2026 OmniDesk · Todos los derechos reservados
    </p>
</footer>
</div>
<script src="assets/omnidesk-layout.js?v=5"></script>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('passwordVisibilityIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  async function handleLogin() {
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    let msg = document.getElementById('loginError');
    if (!msg) { submitBtn.insertAdjacentHTML('beforebegin', '<p id="loginError" role="alert" class="text-sm font-medium" style="color:#f87171"></p>'); msg = document.getElementById('loginError'); }
    msg.textContent = '';
    btnText.textContent = 'Iniciando...';
    btnSpinner.classList.remove('hidden');
    submitBtn.disabled = true;
    try {
      const r = await fetch(OmniDesk.API_URL + '/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ correo: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error ? d.error.mensaje : 'No se pudo iniciar sesión.');
      localStorage.setItem('omnidesk_sesion', JSON.stringify({ token: d.token, usuario: d.usuario }));
      btnText.textContent = 'Acceso Concedido';
      location.href = 'conversaciones.html';
    } catch (e) {
      msg.textContent = e instanceof TypeError ? 'No se pudo conectar con el servidor. ¿Está encendido (npm start)?' : e.message;
      btnText.textContent = 'Iniciar Sesión';
      btnSpinner.classList.add('hidden');
      submitBtn.disabled = false;
    }
  }
</script></main></body></html>
